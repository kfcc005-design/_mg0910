<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="등록된 사내 FAQ를 키워드와 분류로 검색하는 도우미">
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #102a43;
      --blue: #1769e0;
      --blue-dark: #0f4fae;
      --blue-soft: #eaf2ff;
      --ink: #172b3a;
      --muted: #627485;
      --line: #d9e2ec;
      --surface: #ffffff;
      --background: #f3f7fb;
      --mark: #ffe27a;
      --shadow: 0 18px 45px rgba(16, 42, 67, 0.09);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 12% 0%, rgba(23, 105, 224, 0.11), transparent 29rem),
        var(--background);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }

    .app-shell {
      width: min(100% - 32px, 1040px);
      margin: 0 auto;
      padding: 52px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 24px;
    }

    .loan-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      margin-left: auto;
      padding: 0 15px;
      border: 1px solid #b9cde0;
      border-radius: 11px;
      background: white;
      color: var(--navy);
      font-size: 0.875rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 14px rgba(16, 42, 67, 0.08);
      transition: background 0.16s, border-color 0.16s, transform 0.16s;
    }

    .loan-link:hover {
      background: #eef6ff;
      border-color: #79a8d2;
      transform: translateY(-1px);
    }

    .loan-link:focus-visible {
      outline: 3px solid rgba(23, 105, 224, 0.35);
      outline-offset: 3px;
    }

    .loan-link svg { width: 17px; height: 17px; }

    .logo {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 14px;
      background: var(--navy);
      color: white;
      font-weight: 800;
      letter-spacing: -0.04em;
      box-shadow: 0 8px 20px rgba(16, 42, 67, 0.2);
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.65rem, 3vw, 2.25rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .search-panel {
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid rgba(217, 226, 236, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .search-box { position: relative; }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 21px;
      height: 21px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 56px;
      padding: 0 48px 0 52px;
      border: 1px solid #c7d4e1;
      border-radius: 14px;
      outline: none;
      background: white;
      color: var(--ink);
      font-size: 1rem;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #searchInput::placeholder { color: #8292a1; }

    #searchInput:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23, 105, 224, 0.14);
    }

    .clear-button {
      position: absolute;
      top: 50%;
      right: 13px;
      display: none;
      width: 30px;
      height: 30px;
      padding: 0;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: #edf2f7;
      color: #536779;
      cursor: pointer;
    }

    .clear-button.visible { display: grid; place-items: center; }
    .clear-button:hover { background: #dfe8f1; }

    .show-all-button {
      height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 14px;
      background: var(--navy);
      color: white;
      font-weight: 750;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .show-all-button:hover { background: #1d4668; }
    .show-all-button:active { transform: translateY(1px); }

    .category-group { margin-top: 24px; }

    .group-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .category-button {
      min-height: 42px;
      padding: 8px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: #405466;
      font-weight: 700;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .category-button:hover { border-color: #9eb8d4; background: #f8fbff; }

    .category-button[aria-pressed="true"] {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
      box-shadow: 0 6px 15px rgba(23, 105, 224, 0.2);
    }

    .results-section { margin-top: 30px; }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .results-title {
      margin: 0;
      color: var(--navy);
      font-size: 1.18rem;
      letter-spacing: -0.02em;
    }

    #resultCount {
      color: var(--blue-dark);
      font-size: 0.95rem;
      font-weight: 800;
    }

    .result-list {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .result-card {
      padding: clamp(20px, 4vw, 28px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(16, 42, 67, 0.045);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .question-wrap { display: flex; gap: 13px; min-width: 0; }

    .q-label {
      flex: 0 0 auto;
      color: var(--blue);
      font-size: 1.05rem;
      font-weight: 850;
    }

    .question {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--navy);
      font-size: 1.08rem;
      font-weight: 760;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .category-badge {
      flex: 0 0 auto;
      min-height: 29px;
      padding: 3px 11px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 0.8rem;
      font-weight: 800;
      white-space: pre-wrap;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 13px;
      margin-top: 17px;
      padding-top: 17px;
      border-top: 1px solid #e7edf3;
    }

    .a-label { color: #60758a; font-weight: 850; }

    .answer {
      margin: 0;
      overflow-wrap: anywhere;
      color: #405466;
      white-space: pre-wrap;
    }

    mark {
      padding: 0.05em 0.13em;
      border-radius: 0.2em;
      background: var(--mark);
      color: inherit;
    }

    .empty-state {
      display: none;
      padding: 58px 24px;
      border: 1px dashed #b9c8d6;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      text-align: center;
    }

    .empty-state.visible { display: block; }

    .empty-icon {
      display: grid;
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      place-items: center;
      border-radius: 17px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 1.5rem;
      font-weight: 850;
    }

    .empty-state p {
      margin: 0;
      color: #42596c;
      font-size: 1rem;
      line-height: 1.75;
    }

    button:focus-visible {
      outline: 3px solid rgba(23, 105, 224, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .app-shell { width: min(100% - 22px, 1040px); padding-top: 28px; }
      .topbar { gap: 9px; }
      .loan-link { min-height: 40px; padding: 0 11px; font-size: 0.8rem; }
      .loan-link svg { display: none; }
      .search-row { grid-template-columns: 1fr; }
      .show-all-button { width: 100%; }
      .card-top { display: block; }
      .category-badge { display: inline-block; margin: 14px 0 0 39px; }
      .results-header { align-items: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="logo" aria-hidden="true">FAQ</div>
      <h1>업무 FAQ 검색</h1>
      <a class="loan-link" href="https://kfcc005-design.github.io/_mg0910/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16v11H4z"></path><path d="M7 7V5h10v2M8 11h8M8 14h5"></path></svg>
        대출 계산기
      </a>
    </header>

    <section class="search-panel" aria-label="FAQ 검색 조건">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.7-3.7"></path>
          </svg>
          <label for="searchInput" class="sr-only">FAQ 검색어</label>
          <input id="searchInput" type="search" placeholder="질문이나 키워드를 입력하세요." autocomplete="off">
          <button type="button" id="clearButton" class="clear-button" aria-label="검색어 지우기">×</button>
        </div>
        <button type="button" id="showAllButton" class="show-all-button">전체보기</button>
      </div>

      <div class="category-group">
        <span class="group-label">분류</span>
        <div id="categoryButtons" class="category-buttons" role="group" aria-label="FAQ 분류">
          <button type="button" class="category-button" data-category="전체" aria-pressed="true">전체</button>
          <button type="button" class="category-button" data-category="교육" aria-pressed="false">교육</button>
          <button type="button" class="category-button" data-category="문서" aria-pressed="false">문서</button>
          <button type="button" class="category-button" data-category="IT" aria-pressed="false">IT</button>
          <button type="button" class="category-button" data-category="보안" aria-pressed="false">보안</button>
        </div>
      </div>
    </section>

    <section class="results-section" aria-labelledby="resultsTitle">
      <div class="results-header">
        <h2 id="resultsTitle" class="results-title">검색 결과</h2>
        <span id="resultCount" aria-live="polite">0건</span>
      </div>
      <ul id="resultList" class="result-list"></ul>
      <div id="emptyState" class="empty-state" role="status">
        <div class="empty-icon" aria-hidden="true">?</div>
        <p>등록된 FAQ에서 답변을 찾을 수 없습니다.<br>관련 담당부서 또는 공식 안내자료를 확인해 주세요.</p>
      </div>
    </section>
  </main>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    // 첨부 JSON의 데이터를 변형하거나 보완하지 않고 그대로 사용합니다.
    const faqData = [
  {
    "category": "교육",
    "question": "교육 신청은 어디에서 하나요?",
    "answer_seed": "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
  },
  {
    "category": "교육",
    "question": "신청한 교육을 취소하려면 어떻게 하나요?",
    "answer_seed": "신청내역에서 취소 가능 여부를 확인합니다."
  },
  {
    "category": "문서",
    "question": "주간 업무보고에는 무엇을 넣어야 하나요?",
    "answer_seed": "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
  },
  {
    "category": "IT",
    "question": "사내 시스템 접속이 되지 않습니다.",
    "answer_seed": "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
  },
  {
    "category": "보안",
    "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?",
    "answer_seed": "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
  }
];

    const searchInput = document.getElementById("searchInput");
    const clearButton = document.getElementById("clearButton");
    const showAllButton = document.getElementById("showAllButton");
    const categoryButtons = document.getElementById("categoryButtons");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");

    let selectedCategory = "전체";

    function appendHighlightedText(element, value, keyword) {
      const text = String(value ?? "");
      if (!keyword) {
        element.textContent = text;
        return;
      }

      const lowerText = text.toLocaleLowerCase("ko-KR");
      const lowerKeyword = keyword.toLocaleLowerCase("ko-KR");
      let cursor = 0;
      let matchIndex = lowerText.indexOf(lowerKeyword, cursor);

      while (matchIndex !== -1) {
        element.append(document.createTextNode(text.slice(cursor, matchIndex)));
        const mark = document.createElement("mark");
        mark.textContent = text.slice(matchIndex, matchIndex + keyword.length);
        element.append(mark);
        cursor = matchIndex + keyword.length;
        matchIndex = lowerText.indexOf(lowerKeyword, cursor);
      }
      element.append(document.createTextNode(text.slice(cursor)));
    }

    function createResultCard(item, keyword) {
      const li = document.createElement("li");
      li.className = "result-card";

      const top = document.createElement("div");
      top.className = "card-top";

      const questionWrap = document.createElement("div");
      questionWrap.className = "question-wrap";
      const qLabel = document.createElement("span");
      qLabel.className = "q-label";
      qLabel.textContent = "Q";
      qLabel.setAttribute("aria-hidden", "true");
      const question = document.createElement("p");
      question.className = "question";
      appendHighlightedText(question, item.question, keyword);
      questionWrap.append(qLabel, question);

      const badge = document.createElement("span");
      badge.className = "category-badge";
      appendHighlightedText(badge, item.category, keyword);
      badge.setAttribute("aria-label", `분류: ${item.category}`);
      top.append(questionWrap, badge);

      const answerRow = document.createElement("div");
      answerRow.className = "answer-row";
      const aLabel = document.createElement("span");
      aLabel.className = "a-label";
      aLabel.textContent = "A";
      aLabel.setAttribute("aria-hidden", "true");
      const answer = document.createElement("p");
      answer.className = "answer";
      appendHighlightedText(answer, item.answer_seed, keyword);
      answerRow.append(aLabel, answer);

      li.append(top, answerRow);
      return li;
    }

    function renderResults() {
      const keyword = searchInput.value.trim();
      const normalizedKeyword = keyword.toLocaleLowerCase("ko-KR");

      const filtered = faqData.filter((item) => {
        const matchesCategory = selectedCategory === "전체" || item.category === selectedCategory;
        const searchableText = `${item.question} ${item.answer_seed} ${item.category}`.toLocaleLowerCase("ko-KR");
        return matchesCategory && (!normalizedKeyword || searchableText.includes(normalizedKeyword));
      });

      resultList.replaceChildren(...filtered.map((item) => createResultCard(item, keyword)));
      resultCount.textContent = `${filtered.length}건`;
      emptyState.classList.toggle("visible", filtered.length === 0);
      clearButton.classList.toggle("visible", searchInput.value.length > 0);
    }

    searchInput.addEventListener("input", renderResults);

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      renderResults();
    });

    categoryButtons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      selectedCategory = button.dataset.category;
      categoryButtons.querySelectorAll("[data-category]").forEach((item) => {
        item.setAttribute("aria-pressed", String(item === button));
      });
      renderResults();
    });

    showAllButton.addEventListener("click", () => {
      selectedCategory = "전체";
      searchInput.value = "";
      categoryButtons.querySelectorAll("[data-category]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.category === "전체"));
      });
      renderResults();
      searchInput.focus();
    });

    renderResults();
  </script>
</body>
</html>
