<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 FAQ 검색 도우미</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #173760;
      --blue: #245f9d;
      --pale-blue: #edf5fc;
      --line: #d9e2ec;
      --text: #1e293b;
      --muted: #66758a;
      --surface: #ffffff;
      --background: #f4f7fa;
      --highlight: #fff0a8;
      --shadow: 0 12px 30px rgba(23, 55, 96, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #edf4fa 0, var(--background) 300px);
    }

    button, input { font: inherit; }

    .container {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    .header { margin-bottom: 26px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.2;
      letter-spacing: -.04em;
    }

    .description {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .search-panel {
      padding: 22px;
      border: 1px solid rgba(217, 226, 236, .9);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
    }

    .search-wrap { position: relative; }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 21px;
      height: 21px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 56px;
      padding: 0 52px;
      border: 1px solid #cbd6e2;
      border-radius: 13px;
      outline: none;
      color: var(--text);
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }

    #searchInput::placeholder { color: #8996a8; }
    #searchInput:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(36, 95, 157, .13);
    }

    #clearSearch {
      position: absolute;
      top: 50%;
      right: 13px;
      display: none;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      transform: translateY(-50%);
      color: #536276;
      background: #edf1f5;
      cursor: pointer;
    }

    .filter-label {
      margin: 20px 0 10px;
      color: #4a5a70;
      font-size: 14px;
      font-weight: 750;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn, #showAll {
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #ccd7e3;
      border-radius: 999px;
      color: #46566b;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s ease;
    }

    .filter-btn:hover, #showAll:hover { border-color: var(--blue); color: var(--blue); }
    .filter-btn.active {
      border-color: var(--navy);
      color: #fff;
      background: var(--navy);
    }

    .results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 34px 2px 14px;
    }

    #resultCount { margin: 0; font-weight: 800; color: var(--navy); }
    #resultCount strong { color: var(--blue); font-size: 20px; }
    #showAll { border-radius: 10px; background: transparent; }

    .results { display: grid; gap: 14px; }

    .faq-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(23, 55, 96, .045);
    }

    .category {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      padding: 0 11px;
      border-radius: 7px;
      color: var(--blue);
      background: var(--pale-blue);
      font-size: 13px;
      font-weight: 800;
    }

    .question {
      margin: 14px 0 10px;
      color: var(--navy);
      font-size: 19px;
      line-height: 1.55;
    }

    .question::before { content: "Q. "; color: var(--blue); }

    .answer {
      margin: 0;
      padding-left: 22px;
      color: #48576b;
      line-height: 1.75;
      position: relative;
    }

    .answer::before {
      content: "A.";
      position: absolute;
      left: 0;
      color: var(--blue);
      font-weight: 800;
    }

    mark {
      padding: 1px 2px;
      border-radius: 3px;
      color: inherit;
      background: var(--highlight);
      font-weight: 800;
    }

    .empty-state {
      padding: 54px 24px;
      border: 1px dashed #c8d4e1;
      border-radius: 16px;
      text-align: center;
      background: rgba(255, 255, 255, .7);
    }

    .empty-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 50%;
      place-items: center;
      color: var(--blue);
      background: var(--pale-blue);
      font-size: 24px;
      font-weight: 900;
    }

    .empty-state p { margin: 0; color: #4f5f73; line-height: 1.8; }

    @media (max-width: 600px) {
      .container { width: min(100% - 22px, 920px); padding-top: 32px; }
      .search-panel { padding: 16px; border-radius: 16px; }
      .results-toolbar { align-items: flex-end; }
      .faq-card { padding: 20px; }
      .filter-btn { flex: 1 0 calc(33.333% - 8px); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">INTERNAL FAQ</p>
      <h1>업무 FAQ 검색</h1>
      <p class="description">등록된 사내 FAQ에서 필요한 업무 안내를 빠르게 찾아보세요.</p>
    </header>

    <section class="search-panel" aria-label="FAQ 검색 및 분류">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
        </svg>
        <label for="searchInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">질문이나 키워드 검색</label>
        <input id="searchInput" type="search" placeholder="질문이나 키워드를 입력하세요." autocomplete="off">
        <button id="clearSearch" type="button" aria-label="검색어 지우기">×</button>
      </div>

      <p class="filter-label">분류</p>
      <div class="filters" role="group" aria-label="FAQ 분류">
        <button class="filter-btn active" type="button" data-category="전체" aria-pressed="true">전체</button>
        <button class="filter-btn" type="button" data-category="교육" aria-pressed="false">교육</button>
        <button class="filter-btn" type="button" data-category="문서" aria-pressed="false">문서</button>
        <button class="filter-btn" type="button" data-category="IT" aria-pressed="false">IT</button>
        <button class="filter-btn" type="button" data-category="보안" aria-pressed="false">보안</button>
      </div>
    </section>

    <section aria-labelledby="resultCount">
      <div class="results-toolbar">
        <p id="resultCount" aria-live="polite"></p>
        <button id="showAll" type="button">전체보기</button>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <script>
    // 첨부된 JSON의 정보만 사용합니다. 검색 실패 시 새로운 답변을 생성하지 않습니다.
    const faqData = [
      { category: "교육", question: "교육 신청은 어디에서 하나요?", answer: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다." },
      { category: "교육", question: "신청한 교육을 취소하려면 어떻게 하나요?", answer: "신청내역에서 취소 가능 여부를 확인합니다." },
      { category: "문서", question: "주간 업무보고에는 무엇을 넣어야 하나요?", answer: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다." },
      { category: "IT", question: "사내 시스템 접속이 되지 않습니다.", answer: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다." },
      { category: "보안", question: "ChatGPT에 내부 업무자료를 넣어도 되나요?", answer: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다." }
    ];

    const searchInput = document.querySelector("#searchInput");
    const clearSearch = document.querySelector("#clearSearch");
    const filterButtons = [...document.querySelectorAll(".filter-btn")];
    const resultCount = document.querySelector("#resultCount");
    const results = document.querySelector("#results");
    const showAll = document.querySelector("#showAll");
    let activeCategory = "전체";

    const normalize = (text) => text.toLocaleLowerCase("ko-KR").trim();

    function escapeHtml(text) {
      return String(text).replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    function highlight(text, query) {
      const safeText = escapeHtml(text);
      const terms = normalize(query).split(/\s+/).filter(Boolean);
      if (!terms.length) return safeText;
      const escapedTerms = terms.map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      const pattern = new RegExp(`(${escapedTerms.join("|")})`, "gi");
      return safeText.replace(pattern, "<mark>$1</mark>");
    }

    function getFilteredFaqs() {
      const query = normalize(searchInput.value);
      const terms = query.split(/\s+/).filter(Boolean);
      return faqData.filter((faq) => {
        const matchesCategory = activeCategory === "전체" || faq.category === activeCategory;
        const searchableText = normalize(`${faq.question} ${faq.answer}`);
        const matchesKeyword = terms.every((term) => searchableText.includes(term));
        return matchesCategory && matchesKeyword;
      });
    }

    function render() {
      const query = searchInput.value.trim();
      const filtered = getFilteredFaqs();
      resultCount.innerHTML = `검색 결과 <strong>${filtered.length}</strong>건`;
      clearSearch.style.display = query ? "block" : "none";

      if (!filtered.length) {
        results.innerHTML = `
          <div class="empty-state" role="status">
            <div class="empty-icon" aria-hidden="true">!</div>
            <p>등록된 FAQ에서 답변을 찾을 수 없습니다.<br>관련 담당부서 또는 공식 안내자료를 확인해 주세요.</p>
          </div>`;
        return;
      }

      results.innerHTML = filtered.map((faq) => `
        <article class="faq-card">
          <span class="category">${escapeHtml(faq.category)}</span>
          <h2 class="question">${highlight(faq.question, query)}</h2>
          <p class="answer">${highlight(faq.answer, query)}</p>
        </article>`).join("");
    }

    searchInput.addEventListener("input", render);

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      render();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        filterButtons.forEach((item) => {
          const isActive = item === button;
          item.classList.toggle("active", isActive);
          item.setAttribute("aria-pressed", String(isActive));
        });
        render();
      });
    });

    showAll.addEventListener("click", () => {
      searchInput.value = "";
      activeCategory = "전체";
      filterButtons.forEach((button) => {
        const isActive = button.dataset.category === "전체";
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      render();
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
